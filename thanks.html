<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Thanks — Livewire Network Solutions</title>
<meta name="description" content="Thanks for reaching out to Livewire Network Solutions." />
<meta name="theme-color" content="#1a1d21" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="styles.css" />
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%2300d4a8'%3E%3Cpath d='M13 2 4 14h7l-2 8 10-13h-7l1-7z'/%3E%3C/svg%3E" />
<style>
  .thanks-wrap {
    min-height: 70vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 80px 0;
  }
  .thanks-card {
    max-width: 560px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius-lg);
    padding: 56px 48px;
    box-shadow: var(--shadow-lg);
    position: relative;
    overflow: hidden;
  }
  .thanks-card::before {
    content: "";
    position: absolute; inset: 0 0 auto 0;
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--teal), transparent);
  }
  .thanks-card .check {
    width: 64px; height: 64px;
    border-radius: 50%;
    background: var(--teal-soft);
    color: var(--teal);
    display: grid; place-items: center;
    margin: 0 auto 24px;
    box-shadow: 0 0 0 1px rgba(0,212,168,.3), 0 0 24px rgba(0,212,168,.2);
  }
  .thanks-card h1 {
    font-size: clamp(1.7rem, 3vw, 2.2rem);
    margin-bottom: 14px;
  }
  .thanks-card p {
    font-size: 1.02rem;
    max-width: 42ch;
    margin: 0 auto 28px;
  }
  .thanks-card a.callout {
    font-family: 'JetBrains Mono', monospace;
    font-size: 13px;
    color: var(--text-muted);
    display: block;
    margin-top: 18px;
  }
  .thanks-card a.callout strong {
    color: var(--teal);
    font-weight: 600;
  }
</style>
</head>
<body>

<header class="site">
  <div class="container nav">
    <a class="brand" href="/">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2 4 14h7l-2 8 10-13h-7l1-7z"/></svg>
      </span>
      <span class="brand-text">
        <span class="brand-name">Livewire</span>
        <span class="brand-sub">Network Solutions</span>
      </span>
    </a>
  </div>
</header>

<main>
  <div class="container">
    <div class="thanks-wrap">
      <div class="thanks-card">
        <div class="check" aria-hidden="true">
          <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
        </div>
        <h1>Message received. Thanks.</h1>
        <p>We'll get back to you within one business day. If it's time-sensitive, give us a call and we'll get you on the schedule.</p>
        <a class="btn btn-primary" href="/">← Back to home</a>
        <a class="callout" href="tel:+12604085500">Time-sensitive? Call <strong>(260) 408-5500</strong></a>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="container copyright" style="margin: 0; padding: 22px 0; border: none;">
    <span>© <span id="year">2026</span> Livewire Network Solutions</span>
    <span>Fort Wayne, IN</span>
  </div>
</footer>

<script>
  document.getElementById('year').textContent = new Date().getFullYear();
</script>
</body>
</html>
